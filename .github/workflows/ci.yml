name: Rust
on: [push, pull_request]
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install little-cms2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build native editor signal probe
        run: cargo build --bin rawpuppy --example editor_signal_probe --locked
      - name: Native editor signal verification on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x960x24" target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Native editor signal verification
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/debug/examples/editor_signal_probe.exe --editor target/debug/rawpuppy.exe --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Optional neural inference builds
        # Probe artifacts use only generated fixtures, not user photographs.
        run: cargo check --features neural --locked
      - name: Retain native editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-${{ runner.os }}
          path: ${{ runner.temp }}/rawpuppy-editor-*
          if-no-files-found: ignore
      - name: CUDA adapter compilation without requiring a GPU
        if: runner.os == 'Linux'
        run: cargo check --features cuda --all-targets --locked
      - name: Vulkan compute parity on software GPU
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: '33554432'
        run: cargo test --test gpu --test hdr -- --ignored
      - name: Automatic ICC discovery on isolated X11 display
        if: runner.os == 'Linux'
        env:
          RAWPUPPY_TEST_ISOLATED_DISPLAY: '1'
        run: xvfb-run -a -s "-screen 0 1440x960x24" cargo test --test display x11_profile_discovery_tracks_root_property_updates -- --ignored
      - name: Probe native Metal compute parity
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          RUST_MIN_STACK: '33554432'
        run: cargo test --test gpu --test hdr -- --ignored --nocapture
  native-moebius:
    runs-on: ubuntu-latest
    env:
      LIBTORCH_USE_PYTORCH: '1'
      CXX: clang++
      CXXFLAGS: '-g0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y liblcms2-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features moebius,raw-ml --all-targets -j 2 -- -D warnings
      - name: Native scheduler and layer tests
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent / "lib")'):${LD_LIBRARY_PATH:-}"
          cargo test --features moebius,raw-ml -j 2
