name: Rust
on: [push, pull_request]
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install little-cms2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build native editor signal probe
        run: cargo build --bin rawpuppy --example editor_signal_probe --locked
      - name: Native editor signal verification on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x960x24" target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Native editor signal verification
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/debug/examples/editor_signal_probe.exe --editor target/debug/rawpuppy.exe --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Optional neural inference builds
        # Probe artifacts use only generated fixtures, not user photographs.
        run: cargo check --features neural --locked
      - name: Retain native editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-${{ runner.os }}
          path: ${{ runner.temp }}/rawpuppy-editor-*
          if-no-files-found: ignore
      - name: CUDA adapter compilation without requiring a GPU
        if: runner.os == 'Linux'
        run: cargo check --features cuda --all-targets --locked
      - name: Vulkan compute parity on software GPU
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          cargo test --test gpu --test hdr -- --ignored
          cargo test --lib gpu::selection_tests::unavailable_or_panicking_cuda_still_renders_on_native_gpu -- --ignored
      - name: Automatic ICC discovery on isolated X11 display
        if: runner.os == 'Linux'
        env:
          RAWPUPPY_TEST_ISOLATED_DISPLAY: '1'
        run: xvfb-run -a -s "-screen 0 1440x960x24" cargo test --test display x11_ -- --ignored --test-threads=1
      - name: Probe native Metal compute parity
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          cargo test --test gpu --test hdr -- --ignored --nocapture
          cargo test --lib gpu::selection_tests::unavailable_or_panicking_cuda_still_renders_on_native_gpu -- --ignored --nocapture
  native-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIBTORCH_USE_PYTORCH: '1'
      CARGO_BUILD_JOBS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU LibTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native Apple Silicon LibTorch
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.13.0
      - name: Install matching CPU vision library
        if: runner.os != 'macOS'
        run: python -m pip install torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install matching Apple Silicon vision library
        if: runner.os == 'macOS'
        run: python -m pip install torchvision==0.28.0
      - name: Install pinned graph preparation dependencies
        run: python -m pip install diffusers==0.41.0 transformers==5.17.0 accelerate==1.15.0 timm==1.0.26 omegaconf==2.4.0 einops==0.8.2 pyyaml==6.0.3
      - name: Configure native library loader
        shell: python
        run: |
          import os, pathlib, torch
          library = str(pathlib.Path(torch.__file__).parent / 'lib')
          with open(os.environ['GITHUB_PATH'], 'a') as handle:
              handle.write(library + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              if os.environ['RUNNER_OS'] == 'Linux':
                  handle.write('CXX=clang++\nCXXFLAGS=-g0\n')
                  handle.write('LD_LIBRARY_PATH=' + library + '\n')
              elif os.environ['RUNNER_OS'] == 'macOS':
                  handle.write('DYLD_LIBRARY_PATH=' + library + '\n')
                  handle.write('RAWPUPPY_TEST_REQUIRE_MPS=1\n')
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('rawpuppy-native-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              handle.write('RAWPUPPY_CI_MODEL_ROOT=' + str(root) + '\n')
              handle.write('RAWPUPPY_TEST_RAWNIND_GRAPH=' + str(root / 'graph') + '\n')
              handle.write('RAWPUPPY_TEST_MOEBIUS_GRAPH=' + str(root / 'moebius' / 'graph') + '\n')
              handle.write('XDG_CACHE_HOME=' + str(root / 'cache') + '\n')
      - name: Linux neural build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev libxkbcommon-dev libwayland-dev
      - name: macOS neural build dependencies
        if: runner.os == 'macOS'
        run: brew install little-cms2
      - name: Prepare verified real RAW graph
        shell: bash
        run: python tools/prepare_ci_raw_model.py "$RAWPUPPY_CI_MODEL_ROOT"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features moebius,raw-ml --all-targets -j 2 -- -D warnings
      - name: Native scheduler and layer tests
        run: cargo test --features moebius,raw-ml -j 2 --locked
      - name: Install attributed RAW graph for renderer tests
        shell: bash
        run: cargo run --features moebius,raw-ml -j 2 --locked -- install-raw-model "$RAWPUPPY_TEST_RAWNIND_GRAPH"
      - name: Real native RAW inference and CPU parity
        run: cargo test --features moebius,raw-ml --test raw_ml -j 2 --locked -- --ignored --test-threads=1 --nocapture
      - name: Prepare verified real inpainting graphs
        shell: bash
        run: python tools/test_moebius_export.py
      - name: Export verified real inpainting graphs
        shell: bash
        run: python tools/prepare_ci_moebius.py "$RAWPUPPY_CI_MODEL_ROOT/moebius"
      - name: Real native inpainting on the selected device and CPU
        run: cargo test --features moebius,raw-ml --test moebius -j 2 --locked -- --ignored --test-threads=1 --nocapture
      - name: Retain native graph provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-learning-${{ runner.os }}
          path: |
            ${{ env.RAWPUPPY_TEST_RAWNIND_GRAPH }}/manifest.json
            ${{ env.RAWPUPPY_TEST_RAWNIND_GRAPH }}/NOTICE.txt
            ${{ env.RAWPUPPY_TEST_MOEBIUS_GRAPH }}/manifest.json
          if-no-files-found: ignore
