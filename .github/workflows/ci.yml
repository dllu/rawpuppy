name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install little-cms2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: DNG camera normalization and calibration
        run: cargo test --example raw_color_fixture --locked
      - name: Build native editor signal probe
        run: cargo build --bin rawpuppy --example editor_signal_probe --locked
      - name: Native editor signal verification on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x960x24" target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Native editor signal verification
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/debug/examples/editor_signal_probe.exe --editor target/debug/rawpuppy.exe --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            target/debug/examples/editor_signal_probe --editor target/debug/rawpuppy --output "$RUNNER_TEMP/rawpuppy-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Builds without CUDA or photo compute
        run: |
          cargo check --no-default-features --all-targets --locked
          cargo check --no-default-features --features gpu --all-targets --locked
      - name: Retain native editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-${{ runner.os }}
          path: ${{ runner.temp }}/rawpuppy-editor-*
          if-no-files-found: ignore
      - name: Vulkan compute parity on software GPU
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          # Hosted runners have Vulkan, not an NVIDIA CUDA device.
          cargo test --no-default-features --features gpu --test gpu --test hdr --locked -- --ignored
          cargo test --lib gpu::selection_tests::unavailable_or_panicking_cuda_still_renders_on_native_gpu -- --ignored
          cargo test --lib gpu::tile_tests::tiny_output_bindings_preserve_global_coordinates_and_composed_edits -- --ignored
          cargo test --example raw_color_fixture wide_dng_gpu_preserves_raw_coordinates_and_hot_pixel_cleanup -- --ignored
      - name: Automatic ICC discovery on isolated X11 display
        if: runner.os == 'Linux'
        env:
          RAWPUPPY_TEST_ISOLATED_DISPLAY: '1'
        run: xvfb-run -a -s "-screen 0 1440x960x24" cargo test --test display x11_ -- --ignored --test-threads=1
      - name: Metal compute parity on native GPU
        if: runner.os == 'macOS'
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          # Exercise Metal without including the CUDA-only integration tests.
          cargo test --no-default-features --features gpu --test gpu --test hdr --locked -- --ignored --nocapture
          cargo test --lib gpu::selection_tests::unavailable_or_panicking_cuda_still_renders_on_native_gpu -- --ignored --nocapture
          cargo test --lib gpu::tile_tests::tiny_output_bindings_preserve_global_coordinates_and_composed_edits -- --ignored --nocapture
          cargo test --example raw_color_fixture wide_dng_gpu_preserves_raw_coordinates_and_hot_pixel_cleanup -- --ignored --nocapture
