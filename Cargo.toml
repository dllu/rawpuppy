[package]
name = "rawpuppy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
quick-xml = "0.41"
rawler = "0.8"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lcms2 = "6.1"
tempfile = "3"
bytemuck = "1.25"
tiff = "0.11"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
