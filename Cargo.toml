[package]
name = "rawpuppy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
exr = "1.74"
quick-xml = "0.41"
rawler = "0.8"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lcms2 = "6.1"
tempfile = "3"
bytemuck = "1.25"
tiff = "0.11"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
cubecl = { version = "0.10", optional = true, default-features = false, features = ["std", "wgpu"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tch = { version = "0.26", optional = true }
libloading = { version = "0.8", optional = true }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[features]
default = ["gpu"]
gpu = ["dep:cubecl"]
cuda = ["gpu", "cubecl/cuda"]
neural = ["dep:ort"]
moebius = ["dep:tch", "dep:libloading"]

[profile.release]
lto = "thin"
codegen-units = 1
