[package]
name = "rawpuppy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
exr = "1.74"
quick-xml = "0.41"
rawler = "0.8"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lcms2 = "6.1"
tempfile = "3"
bytemuck = "1.25"
raw-window-handle = "0.6"
tiff = "0.11"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
cubecl = { version = "0.10", optional = true, default-features = false, features = ["std", "wgpu"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tch = { version = "0.26", optional = true }
libloading = { version = "0.8", optional = true }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
x11rb = { version = "0.13", features = ["randr", "xinerama"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5.19", features = ["blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_ColorSystem"] }

[features]
default = ["gpu"]
gpu = ["dep:cubecl"]
cuda = ["gpu", "cubecl/cuda", "dep:cudarc", "dep:libc"]
neural = ["dep:ort"]
moebius = ["dep:tch", "dep:libloading"]
raw-ml = ["dep:tch", "dep:libloading"]

[profile.release]
lto = "thin"
codegen-units = 1
